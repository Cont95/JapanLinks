/* ===== TOKYO NIGHT UI ===== */
:root{
  --bg:#070b12;--panel:#0d1420;--panel2:#111a28;--text:#f4f7fb;--muted:#9aa8bb;
  --line:rgba(255,255,255,.08);--red:#ff304f;--red2:#ff1744;--cyan:#39d9ff;
  --shadow:0 14px 40px rgba(0,0,0,.34)
}
html{background:var(--bg);scroll-behavior:smooth}
body{background:
  radial-gradient(circle at 10% 0%,rgba(255,48,79,.08),transparent 28%),
  radial-gradient(circle at 90% 20%,rgba(57,217,255,.055),transparent 24%),var(--bg);
  color:var(--text)}
.wrap{max-width:900px;padding:14px 12px 90px}
.hero{position:relative;overflow:hidden;min-height:360px;padding:0;margin-bottom:14px;border-radius:24px;
  background:#090e16 url('https://images.unsplash.com/photo-1614541129217-9d45d7738fe2?auto=format&fit=crop&fm=jpg&q=72&w=1800') center/cover no-repeat;
  box-shadow:var(--shadow);isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:
  linear-gradient(180deg,rgba(3,6,11,.28) 0%,rgba(3,6,11,.48) 36%,rgba(3,6,11,.94) 100%),
  linear-gradient(90deg,rgba(255,23,68,.16),transparent 55%)}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:3px;background:linear-gradient(90deg,transparent,var(--red),var(--cyan),transparent);opacity:.9}
.hero h1,.hero .sub,.hero .search,.hero .zone-select,.hero .toolbar{position:relative;z-index:1}
.hero h1{font-size:clamp(27px,6vw,42px);letter-spacing:-.035em;line-height:1.03;text-shadow:0 3px 18px #000;margin:0;padding:34px 22px 5px}
.hero .sub{font-size:14px;color:#d8e0ea;padding:0 22px;text-shadow:0 2px 12px #000}
.hero .search{width:calc(100% - 36px);margin:22px 18px 0;padding:14px 15px;background:rgba(8,13,22,.86);color:#fff;border:1px solid rgba(255,255,255,.13);box-shadow:0 8px 24px rgba(0,0,0,.25);backdrop-filter:blur(10px)}
.hero .search::placeholder{color:#9ba8b8}
.hero .search:focus,.hero .zone-select:focus{outline:2px solid rgba(57,217,255,.55);outline-offset:1px}
.zone-select{background:rgba(8,13,22,.86);color:#fff;border:1px solid rgba(255,255,255,.12);margin:9px 18px 0;width:calc(100% - 36px);backdrop-filter:blur(10px)}
.toolbar{padding:0 18px 20px;margin-top:10px}
.tool{background:rgba(8,13,22,.78);color:#f5f7fb;border:1px solid rgba(255,255,255,.11);box-shadow:0 4px 16px rgba(0,0,0,.2);transition:transform .16s ease,border-color .16s ease,background .16s ease}
.tool:hover{transform:translateY(-1px);border-color:rgba(57,217,255,.5)}
.tool.active{background:var(--red);color:#fff}
.filters{gap:7px;margin:10px 2px 12px;overflow-x:auto;flex-wrap:nowrap;padding:2px 1px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.filter{flex:0 0 auto;background:#111a28;color:#b9c5d4;border:1px solid var(--line);transition:.16s ease}
.filter:hover{border-color:rgba(255,48,79,.55)}
.filter.active{background:var(--red);color:#fff;border-color:var(--red);box-shadow:0 4px 16px rgba(255,48,79,.2)}
.status{color:var(--muted);margin:8px 3px;font-size:12px}
.tip{background:linear-gradient(135deg,rgba(255,48,79,.09),rgba(57,217,255,.05));border:1px solid rgba(255,255,255,.07);color:#d6deea}
.section-head h2{color:#fff}
.count{background:#1a2432;color:#dbe4ef}
.card{position:relative;background:linear-gradient(145deg,rgba(17,26,40,.98),rgba(10,16,25,.98));border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 8px 24px rgba(0,0,0,.24);transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}
.card:hover{transform:translateY(-1px);border-color:rgba(57,217,255,.2);box-shadow:0 12px 30px rgba(0,0,0,.3)}
.name{color:#fff;font-size:17px;padding-right:44px}
.desc{color:#c5cfdb;line-height:1.48}
.note{color:#8998aa}
.meta{color:#aebacc}
.tag{background:#172131;color:#bfcbd8;border:1px solid rgba(255,255,255,.06)}
.fav{background:#182231;color:#9eacbc;transition:.15s ease}
.card.favorite .fav{background:rgba(255,48,79,.15);color:#ff6b82;border:1px solid rgba(255,48,79,.3)}
.actions{gap:7px}
.btn{min-height:43px;border:1px solid rgba(255,255,255,.06);transition:transform .15s ease,filter .15s ease}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.maps{background:#142b3d;color:#68dfff}
.share{background:#153128;color:#6ff2a1}
.copy{background:#1b2430;color:#d2dae5}
.copybox textarea{background:#0b121c;color:#dbe4ef;border-color:#293548}
.selectbox{color:#b9c5d4}
.selectbox input{accent-color:var(--red)}
.section-select,.select-all{background:#172131;color:#cdd8e5;border:1px solid var(--line)}
.select-clear{background:#151e2b;color:#b7c2d0;border:1px solid var(--line)}
.sharebar{background:rgba(8,13,22,.94);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(14px);box-shadow:0 10px 40px rgba(0,0,0,.45)}
.shareselected{background:var(--red);color:#fff}
.empty{color:#8796a8}
#topBtn{background:#111a28!important;color:#fff!important;border:1px solid rgba(255,255,255,.1)!important;box-shadow:0 6px 22px rgba(0,0,0,.4)!important}
@media (max-width:640px){
  .wrap{padding:8px 9px 90px}
  .hero{min-height:420px;border-radius:20px}
  .hero h1{padding:28px 17px 4px;font-size:30px}
  .hero .sub{padding:0 17px}
  .hero .search{width:calc(100% - 28px);margin:19px 14px 0}
  .zone-select{width:calc(100% - 28px);margin-left:14px;margin-right:14px}
  .toolbar{padding:0 14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .tool{min-height:43px;padding:9px 8px}
  .card{padding:14px 12px;border-radius:16px}
  .actions{grid-template-columns:1fr 1fr 1fr;gap:6px}
  .btn{font-size:12px;min-height:44px}
  .sharebar{bottom:8px;width:calc(100% - 16px);border-radius:15px}
  .shareselected{padding:11px 10px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card,.btn,.tool{transition:none}}

  var out='';
  if(nearMode&&userPos){
    var arr=places.map(function(p,i){var c=placeCoords(p),d=c?distanceKm(userPos.lat,userPos.lng,c[0],c[1]):NaN;if(Number.isFinite(d))nearDistances[i]=d;return [p,i,d];}).sort(function(a,b){var ad=Number.isFinite(a[2])?a[2]:1e9,bd=Number.isFinite(b[2])?b[2]:1e9;return ad-bd||norm(a[0].nome).localeCompare(norm(b[0].nome));});
    out+='<section data-zone="near"><div class="section-head"><h2><span>📍 Vicino a me</span> <span class="count">'+arr.length+'</span></h2></div>';
    arr.forEach(function(x){out+=card(x[0],x[1],x[2]);});out+='</section>';placesRoot.innerHTML=out;bindCards();apply();return;
  }
  var by={};places.forEach(function(p,i){(by[p.zona]||(by[p.zona]=[])).push([p,i]);});
  Object.keys(by).sort().forEach(function(zone){var arr=by[zone].sort(function(a,b){return norm(a[0].nome).localeCompare(norm(b[0].nome));});out+='<section data-zone="'+esc(zone)+'"><div class="section-head"><h2><span>'+esc(zone)+'</span> <span class="count">'+arr.length+'</span></h2><div class="section-tools"><button class="section-select" data-select-zone type="button">☑️ Seleziona zona</button></div></div>';arr.forEach(function(x){out+=card(x[0],x[1]);});out+='</section>';});placesRoot.innerHTML=out;bindCards();apply();
}
function refreshDistanceNotes(){Array.prototype.forEach.call(root.querySelectorAll('.card'),function(c){var i=+c.getAttribute('data-index'),p=places[i],d=Number.isFinite(nearDistances[i])?nearDistances[i]:(userPos&&placeCoords(p)?distanceKm(userPos.lat,userPos.lng,placeCoords(p)[0],placeCoords(p)[1]):NaN);c.setAttribute('data-distance',Number.isFinite(d)?d:'');var n=c.querySelector('.distance-note');if(n){n.textContent=distanceText(d);n.style.display=(userPos&&Number.isFinite(d))?'':'none';}var a=c.querySelector('[data-share-index]');if(a)a.href='https://wa.me/?text='+encodeURIComponent(waText(p,i));var ta=c.querySelector('textarea');if(ta)ta.value=waText(p,i);});}
function apply(){var q=norm(search?search.value:''),cards=root.querySelectorAll('.card'),visible=0;Array.prototype.forEach.call(cards,function(c){var cat=c.getAttribute('data-cat'),zone=c.getAttribute('data-zone'),ok=!q||norm(c.getAttribute('data-search')).indexOf(q)>=0;if(active==='food')ok=ok&&cat==='food';else if(active==='see')ok=ok&&['templi','musei','natura','attrazioni','panorami'].indexOf(cat)>=0;else if(active!=='all')ok=ok&&cat===active;if(forcedZone&&!nearMode)ok=ok&&zone===forcedZone;if(favOnly)ok=ok&&c.classList.contains('favorite');c.style.display=ok?'':'none';if(ok)visible++;});Array.prototype.forEach.call(root.querySelectorAll('section'),function(sec){var n=Array.prototype.some.call(sec.querySelectorAll('.card'),function(c){return c.style.display!== 'none';});sec.style.display=n?'':'none';});var st=root.getElementById('status');if(st)st.textContent=visible+' luoghi visualizzati';}
function bindCards(){
 Array.prototype.forEach.call(root.querySelectorAll('.fav'),function(btn){var card=btn.closest('.card'),i=card.getAttribute('data-index'),p=places[+i],key='giappone-fav-'+i+'-'+norm(p.nome);try{if(localStorage.getItem(key)==='1'){card.classList.add('favorite');btn.textContent='★';}}catch(e){}btn.addEventListener('click',function(e){e.preventDefault();var on=card.classList.toggle('favorite');btn.textContent=on?'★':'☆';try{localStorage.setItem(key,on?'1':'0');}catch(x){}if(favOnly)apply();});});
 Array.prototype.forEach.call(root.querySelectorAll('.copybox summary'),function(s){s.addEventListener('click',function(){var ta=s.parentElement.querySelector('textarea');setTimeout(function(){ta.focus();ta.select();try{navigator.clipboard.writeText(ta.value);}catch(e){}},20);});});
 Array.prototype.forEach.call(root.querySelectorAll('.place-select'),function(cb){cb.addEventListener('change',updateSelection);});
 Array.prototype.forEach.call(root.querySelectorAll('[data-select-zone]'),function(btn){btn.addEventListener('click',function(){var sec=btn.closest('section'),boxes=sec.querySelectorAll('.place-select'),any=Array.prototype.some.call(boxes,function(x){return !x.checked&&x.closest('.card').style.display!=='none';});Array.prototype.forEach.call(boxes,function(x){if(x.closest('.card').style.display!=='none')x.checked=any;});updateSelection();});});
}
function selectedCards(){return Array.prototype.filter.call(root.querySelectorAll('.card'),function(c){var cb=c.querySelector('.place-select');return cb&&cb.checked;});}
function updateSelection(){var n=selectedCards().length,b=root.getElementById('shareBar'),c=root.getElementById('shareCount'),s=root.getElementById('shareSelected');if(c)c.textContent=n+' '+(n===1?'luogo selezionato':'luoghi selezionati');if(s)s.disabled=!n;if(b)b.classList.toggle('show',n>0);}
function resetNear(){nearMode=false;nearDistances={};userPos=null;var b=root.getElementById('nearBtn');if(b)b.classList.remove('active');}
function activate(cat){active=cat||'all';forcedZone=null;resetNear();if(zoneSelect)zoneSelect.value='';favOnly=false;Array.prototype.forEach.call(root.querySelectorAll('.filter'),function(b){b.classList.toggle('active',(b.getAttribute('data-filter')||'all')===active);});var fb=root.getElementById('favBtn');if(fb)fb.classList.remove('active');render();}
function getPosition(){return new Promise(function(resolve,reject){if(!navigator.geolocation)return reject(new Error('no-geolocation'));navigator.geolocation.getCurrentPosition(function(pos){resolve({lat:pos.coords.latitude,lng:pos.coords.longitude});},reject,{enableHighAccuracy:true,timeout:10000,maximumAge:300000});});}
async function geocodePlace(p){if(Number.isFinite(p.lat)&&Number.isFinite(p.lng))return true;if(!p.coordinateQuery)return false;try{var url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=jp&q='+encodeURIComponent(p.coordinateQuery);var r=await fetch(url,{headers:{'Accept':'application/json'}});if(!r.ok)return false;var a=await r.json();if(a&&a[0]&&isFinite(+a[0].lat)&&isFinite(+a[0].lon)){p.lat=+a[0].lat;p.lng=+a[0].lon;return true;}}catch(e){}return false;}
async function geocodeVisible(){if(geocodeBusy)return;geocodeBusy=true;try{var visible=Array.prototype.map.call(root.querySelectorAll('.card'),function(c){return +c.getAttribute('data-index');});for(var n=0;n<visible.length;n++){var i=visible[n],p=places[i];if(!(Number.isFinite(p.lat)&&Number.isFinite(p.lng))){await geocodePlace(p);if(userPos&&Number.isFinite(p.lat)&&Number.isFinite(p.lng))nearDistances[i]=distanceKm(userPos.lat,userPos.lng,p.lat,p.lng);refreshDistanceNotes();}}if(nearMode){render();}}finally{geocodeBusy=false;}}
initZoneSelect();render();
if(search){search.addEventListener('input',function(){apply();if(userPos)geocodeVisible();});search.addEventListener('search',function(){apply();if(userPos)geocodeVisible();});}
if(zoneSelect)zoneSelect.addEventListener('change',function(){forcedZone=zoneSelect.value||null;resetNear();render();});
Array.prototype.forEach.call(root.querySelectorAll('.filter'),function(b){b.addEventListener('click',function(){activate(b.getAttribute('data-filter'));});});
tool('foodBtn',function(){activate('food');});
tool('seeBtn',function(){activate('see');});
tool('favBtn',function(){favOnly=!favOnly;active='all';forcedZone=null;resetNear();if(zoneSelect)zoneSelect.value='';var b=root.getElementById('favBtn');b.classList.toggle('active',favOnly);render();});
function tool(id,fn){var b=root.getElementById(id);if(b)b.addEventListener('click',fn);}
tool('nearBtn',async function(){try{var pos=await getPosition();userPos=pos;nearMode=true;active='all';favOnly=false;forcedZone=null;if(zoneSelect)zoneSelect.value='';var b=root.getElementById('nearBtn');if(b)b.classList.add('active');nearDistances={};render();var st=root.getElementById('status');if(st)st.textContent='Distanze calcolate dalla tua posizione';geocodeVisible();}catch(e){alert('Posizione non disponibile. Consenti la posizione a Safari/Chrome e riprova.');}});
var share=root.getElementById('shareSelected');if(share)share.addEventListener('click',function(){var cs=selectedCards();if(!cs.length)return;var msg='🇯🇵 GIAPPONE — LUOGHI SELEZIONATI\n\n'+cs.map(function(c){return waText(places[+c.getAttribute('data-index')],+c.getAttribute('data-index'));}).join('\n\n');window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank','noopener');});
var top=root.getElementById('topBtn');if(top)top.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'});});
var tc=root.getElementById('totalCount');if(tc)tc.textContent=places.length+' luoghi';
function refreshAfterPosition(){refreshDistanceNotes();apply();}
})();
</script></body></html>
